server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**
          

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order/**
         

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
